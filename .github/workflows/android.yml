name: Android CI

on:
  push:
    branches: [ main, "phase-*" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # whisper.cpp is a git submodule (on-device transcription); the native build
      # needs it, so fetch submodules recursively or assembleRelease fails.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Single build (flavors were collapsed with call recording).
      - name: Assemble (debug)
        run: ./gradlew :app:assembleDebug

      # The shipping (release) build must be clean: R8 succeeds AND it contains no
      # accessibility recording path and none of the debug-only Gate-B trigger
      # (which lives in src/debug and must never reach release).
      - name: Assemble (release)
        run: ./gradlew :app:assembleRelease

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # The seam-graph + encrypted-DB + capture tests are instrumented (they need
      # SQLCipher native libs + a real Keystore + the mic), so they RUN on a
      # physical device via `connectedAndroidTest`, not in this emulator-less
      # runner. CI proves they compile; execution is gated on the device matrix.
      - name: Compile instrumented (seam + storage + capture) tests
        run: >-
          ./gradlew :app:assembleDebugAndroidTest
          :core:data:assembleDebugAndroidTest
          :core:capture:assembleDebugAndroidTest

      # Gate: the release build is free of any accessibility recording path and of
      # the debug capture trigger.
      - name: Verify release build is clean
        run: |
          set -euo pipefail
          PM=$(find app/build/intermediates/merged_manifests/release -name AndroidManifest.xml | head -1)
          if grep -iqE "accessibilit|BIND_ACCESSIBILITY" "$PM"; then
            echo "FAIL: accessibility recording path found in release manifest"; exit 1
          fi
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if grep -q "DebugRecordActivity" "$PM" || \
             unzip -p "$APK" 'classes*.dex' | strings | grep -q "DebugRecordActivity"; then
            echo "FAIL: debug capture trigger present in release build"; exit 1
          fi
          # Gate: the release build ships arm64-v8a ONLY (the Phase-4 native decision,
          # enforced app-wide since Phase 5). whisper.cpp is built arm64-only, so any
          # other ABI is dead weight the app can't use; without the abiFilter, AAR
          # native libs (MediaPipe TFLite, SQLCipher) silently re-add 4 ABIs and ~2x
          # the APK. This asserts no non-arm64 native lib slips back in.
          OTHER_ABIS=$(unzip -l "$APK" 'lib/*' | grep -oE 'lib/[^/]+' | sort -u \
            | grep -v '^lib/arm64-v8a$' || true)
          if [ -n "$OTHER_ABIS" ]; then
            echo "FAIL: release APK contains non-arm64 native libs:"; echo "$OTHER_ABIS"; exit 1
          fi
          echo "OK: release build free of accessibility + debug trigger; arm64-v8a only"

      # Gate: the release artifact cannot phone home — no INTERNET permission and no
      # known telemetry/transport components. Protects the Data Safety "nothing leaves
      # your device" claim on EVERY build: a dependency (e.g. MediaPipe) can silently
      # re-introduce Google datatransport/Firelog telemetry + INTERNET via manifest
      # merge. See tools/verify-release-no-egress.sh + references/phase-10-release.md.
      - name: Verify release is no-egress (no INTERNET, no telemetry)
        run: ./tools/verify-release-no-egress.sh

      # Gate: the release AAB actually SHIPS the whisper model in its install-time
      # asset pack. Catches the class of bug where the app builds + instrumented tests
      # pass (they side-load the model) yet the shipping artifact has no model and
      # transcription fails on install. Device-free; runs every release.
      - name: Verify release ships the model (install-time asset pack)
        run: |
          ./gradlew :app:bundleRelease
          ./tools/verify-release-model-shipped.sh

      # Gate: every Java class the JNI resolves by name (whisper_jni.cpp FindClass) survives
      # R8 in the release dex with its ORIGINAL name. R8 runs only on release, so a missing
      # keep rule silently obfuscates such a class → native FindClass returns null → SIGABRT
      # on every decode (invisible to the debug test suite). Catches this + all future breaks.
      - name: Verify JNI classes survive R8 (release dex)
        run: ./tools/verify-release-jni-classes.sh

      # Gate: every class the MediaPipe Text Embedder resolves by reflection / class-name string /
      # stack walk (MediaPipe Graph/TaskRunner/TextEmbedder, Google Flogger, protobuf-lite) survives
      # R8 with its ORIGINAL name. MediaPipe's AARs ship NO consumer ProGuard rules, so R8 silently
      # obfuscates/strips them → embedder throws at init → semantic search indexes NOTHING (has
      # produced 2 blockers serially: protobuf platform_, then Flogger Graph.<clinit>). Uses
      # mapping.txt as the oracle (catches renaming, not just removal).
      - name: Verify MediaPipe-reflected classes survive R8 (release mapping)
        run: ./tools/verify-release-mediapipe-reflection.sh

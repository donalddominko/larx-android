# Version catalog — single source of truth for dependency versions.
#
# Pins verified by a green build on 2026-06-23 (AGP 8.9.1 / Kotlin 2.1.20 /
# KSP / Hilt 2.56 / Room 2.7.1 / SQLCipher 4.6.1 / coroutines 1.10.1 all resolve
# and compile against SDK 35, JDK 17). Per CLAUDE.md, re-check against release
# notes before bumping; heed deprecation notices. Bump here, never inline.
#
# Release 94 (2026-08-31): compileSdk/targetSdk 35 -> 36 (Android 16). AGP stays
# 8.9.1 — the OFFICIAL minimum AGP for API 36 (about-agp API->AGP table), so no
# AGP/Gradle/NDK bump. NDK stays 27.0.12077973.

